<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة المتجر | Koresh Store</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:,">
</head>
<body>

<div id="site-header"></div>

<!-- شاشة تسجيل الدخول -->
<div class="login-shell" id="loginScreen">
  <div class="card login-card">
    <div class="mark" id="loginMark" style="border-radius:50%;background:linear-gradient(135deg,var(--brass-light),var(--clay));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;overflow:hidden">K</div>
    <h2 style="text-align:center;margin-bottom:4px" id="loginTitle">لوحة تحكم Koresh Store</h2>
    <p class="form-note" style="text-align:center;margin-bottom:22px">الدخول لأصحاب المتجر فقط</p>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field" style="margin-bottom:14px">
        <label>كلمة السر</label>
        <input type="password" id="loginPass" required autofocus>
      </div>
      <div class="warn-note" id="loginError" style="display:none">كلمة السر غلط، حاول تاني</div>
      <button class="btn btn-primary" style="width:100%;margin-top:6px" type="submit">دخول</button>
    </form>
    <p class="form-note" style="margin-top:18px;text-align:center">
      كلمة السر الافتراضية أول مرة: <strong>koresh2026</strong><br>غيّرها فورًا من تبويب "الإعدادات" بعد الدخول.
    </p>
  </div>
</div>

<!-- لوحة التحكم -->
<div id="adminScreen" style="display:none">
  <section class="page-hero">
    <div class="wrap" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px">
      <div>
        <h1>لوحة التحكم</h1>
        <p>تقدر من هنا تضيف منتجاتك، تتابع الطلبات، وترد على الشكاوى</p>
      </div>
      <button class="btn btn-outline" onclick="handleLogout()">تسجيل الخروج</button>
    </div>
  </section>

  <section class="page-content">
    <div class="wrap">
      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="products" onclick="switchTab('products')">المنتجات</button>
        <button class="admin-tab" data-tab="orders" onclick="switchTab('orders')">الطلبات</button>
        <button class="admin-tab" data-tab="complaints" onclick="switchTab('complaints')">الشكاوى والاقتراحات</button>
        <button class="admin-tab" data-tab="settings" onclick="switchTab('settings')">الإعدادات</button>
      </div>
      <div id="tabContent"></div>
    </div>
  </section>
</div>

<div id="site-footer"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/layout.js"></script>
<script src="js/admin.js"></script>
<script>
  renderLayout(null);
  applyLoginBranding();
  checkAuth();
  document.getElementById("modalOverlay").addEventListener("click", (e) => {
    if (e.target.id === "modalOverlay") closeModal();
  });
</script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import {
    getFirestore, collection, doc, getDocs, setDoc, deleteDoc, updateDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD3B0yXZwsukysrQhkl5iE_nAQTxU9c2L4",
    authDomain: "koreshstore-b9206.firebaseapp.com",
    projectId: "koreshstore-b9206",
    storageBucket: "koreshstore-b9206.firebasestorage.app",
    messagingSenderId: "721207539002",
    appId: "1:721207539002:web:3335a2ccdbe87708524c03"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.firebaseDB = db;
  window.firestoreAPI = { db, collection, doc, getDocs, setDoc, deleteDoc, updateDoc, onSnapshot };

  // لو حد تاني عدّل منتجات من جهاز/متصفح تاني، تبويب المنتجات هنا يتحدث تلقائيًا
  if (window.KS && typeof KS.initCloudProducts === "function") {
    KS.initCloudProducts(() => {
      if (typeof currentTab !== "undefined" && currentTab === "products" && typeof renderTab === "function") {
        renderTab();
      }
    });
  }
</script>
</body>
</html>
