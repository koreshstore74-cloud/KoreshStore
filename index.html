<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koresh Store | كل اللي محتاجه في مكان واحد</title>
<meta name="description" content="متجر Koresh Store — إلكترونيات، موبايلات، أزياء، ومنتجات منزلية بأسعار مباشرة وشحن سريع لكل المحافظات.">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/favicon.png">
</head>
<body>

<div id="site-header"></div>

<section class="hero">
  <div class="hero-bg-layers" id="heroBgLayers"></div>
  <div class="hero-bg-dots" id="heroBgDots"></div>
</section>

<section class="hero-actions">
  <div class="wrap hero-actions-inner">
    <a href="#products" class="btn btn-primary">تسوّق دلوقتي</a>
    <a href="#" target="_blank" rel="noopener" id="askProductLink" class="btn btn-outline">اسأل عن منتج</a>
  </div>
</section>

<section class="trust-strip">
  <div class="wrap trust-grid">
    <div class="trust-item">
      <div class="ic">🚚</div>
      <div><h4>شحن سريع وآمن</h4><p>لحد باب البيت في كل المحافظات</p></div>
    </div>
    <div class="trust-item">
      <div class="ic">💵</div>
      <div><h4>الدفع عند الاستلام</h4><p>راجع طلبك قبل ما تدفع</p></div>
    </div>
    <div class="trust-item">
      <div class="ic">↩️</div>
      <div><h4>استبدال سهل</h4><p>خلال 14 يوم من الاستلام</p></div>
    </div>
  </div>
</section>

<section class="section" id="videosPreview" style="display:none">
  <div class="wrap">
    <div class="section-head">
      <div>
        <h2>آخر الفيديوهات</h2>
        <p>شوف أحدث الفيديوهات اللي رفعناها</p>
      </div>
      <a href="videos.html" class="btn btn-outline">كل الفيديوهات</a>
    </div>
    <div class="video-grid" id="homeVideoGrid"></div>
  </div>
</section>

<section class="section" id="products">
  <div class="wrap">
    <div class="section-head">
      <div>
        <h2 id="productsHeading">كل منتجات Koresh Store</h2>
        <p id="productCount">— منتج متاح</p>
      </div>
      <select id="sortSelect" class="field" style="padding:10px 14px;border-radius:10px;border:1px solid var(--line)">
        <option value="featured">الترتيب: المميزة أولًا</option>
        <option value="discount">أكبر خصم</option>
        <option value="price-asc">الأقل سعرًا</option>
        <option value="price-desc">الأعلى سعرًا</option>
      </select>
    </div>
    <div class="cat-row" id="catRow"></div>
    <div class="product-grid" id="productGrid"></div>
  </div>
</section>

<div id="site-footer"></div>

<!-- Variant selection modal -->
<div class="modal-overlay" id="variantOverlay">
  <div class="modal" id="variantModal"></div>
</div>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/layout.js"></script>
<script src="js/store.js"></script>
<script type="module" src="js/firebase-init.js"></script>
<script>
  function updateHeroText() {
    const s = KS.getSettings();
    document.getElementById("askProductLink").href = `https://wa.me/${s.whatsapp}`;
    document.getElementById("productsHeading").textContent = "كل منتجات " + s.storeName;
    renderHeroBackground();
  }
  function onSettingsReady() { updateHeroText(); resetHeroBgTimer(); }

  /* صور خلفية الشاشة الرئيسية — بتتراكب فوق بعض وتتبادل تلقائيًا،
     ومتضافة من لوحة التحكم (admin.html) عبر رفع مباشر من الجهاز */
  let heroBgIndex = 0;
  let heroBgTimer = null;
  function renderHeroBackground() {
    const layers = document.getElementById("heroBgLayers");
    const dots = document.getElementById("heroBgDots");
    const images = KS.getSettings().heroImages || [];
    if (heroBgIndex >= images.length) heroBgIndex = 0;
    layers.innerHTML = "";
    dots.innerHTML = "";
    images.forEach((src, i) => {
      const layer = document.createElement("div");
      layer.className = "hero-bg-layer" + (i === heroBgIndex ? " active" : "");
      layer.style.backgroundImage = `url(${src})`;
      layers.appendChild(layer);

      const dot = document.createElement("button");
      dot.className = i === heroBgIndex ? "active" : "";
      dot.setAttribute("aria-label", "صورة الخلفية " + (i + 1));
      dot.addEventListener("click", () => { heroBgIndex = i; renderHeroBackground(); resetHeroBgTimer(); });
      dots.appendChild(dot);
    });
  }
  function resetHeroBgTimer() {
    clearInterval(heroBgTimer);
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    heroBgTimer = setInterval(() => {
      const images = KS.getSettings().heroImages || [];
      if (images.length < 2) return;
      heroBgIndex = (heroBgIndex + 1) % images.length;
      renderHeroBackground();
    }, 5500);
  }

  function renderHomeVideos() {
    const videos = KS.getVideos().slice(0, 3);
    const section = document.getElementById("videosPreview");
    const grid = document.getElementById("homeVideoGrid");
    if (!videos.length) { section.style.display = "none"; return; }
    section.style.display = "";
    grid.innerHTML = videos.map(v => `
      <div class="card video-card">
        <video src="${v.url}" controls preload="metadata"></video>
        <div style="margin-top:10px;font-weight:700">${v.name || "فيديو"}</div>
      </div>
    `).join("");
  }

  bootstrapPage("home");
  updateHeroText();
  resetHeroBgTimer();
  KS.initCloudVideos(() => renderHomeVideos());
  document.getElementById("variantOverlay").addEventListener("click", (e) => {
    if (e.target.id === "variantOverlay") closeVariantModal();
  });
</script>
</body>
</html>
