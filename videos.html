<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الفيديوهات | Koresh Store</title>
<meta name="description" content="فيديوهات Koresh Store — شاهد أحدث الفيديوهات اللي رفعها المتجر.">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/favicon.png">
</head>
<body>

<div id="site-header"></div>

<section class="page-hero">
  <div class="wrap">
    <h1>الفيديوهات</h1>
    <p>أحدث الفيديوهات اللي رفعها المتجر</p>
  </div>
</section>

<section class="page-content">
  <div class="wrap">
    <div id="videosContainer"><div class="empty-state">جاري تحميل الفيديوهات...</div></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/layout.js"></script>
<script type="module" src="js/firebase-init.js"></script>
<script>
  function renderVideos() {
    const container = document.getElementById("videosContainer");
    const videos = KS.getVideos();
    if (videos.length === 0) {
      container.innerHTML = `<div class="empty-state">لسه مفيش فيديوهات متضافة</div>`;
      return;
    }
    container.innerHTML = `
      <div class="video-grid">
        ${videos.map(v => `
          <div class="card video-card">
            <video src="${v.url}" controls preload="metadata"></video>
            <div style="margin-top:10px;font-weight:700">${v.name || "فيديو"}</div>
          </div>
        `).join("")}
      </div>
    `;
  }

  bootstrapPage("videos");
  KS.initCloudVideos(() => renderVideos());
</script>
</body>
</html>
