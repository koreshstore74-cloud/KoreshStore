<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الشكاوى والاقتراحات | Koresh Store</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/favicon.png">
</head>
<body>

<div id="site-header"></div>

<section class="page-hero">
  <div class="wrap">
    <h1>الشكاوى والاقتراحات</h1>
    <p>رأيك بيهمنا — ابعتلنا شكوى أو اقتراح وهنرد عليك في أسرع وقت</p>
  </div>
</section>

<section class="page-content">
  <div class="wrap grid-2" id="complaintsLayout">

    <div class="card">
      <h3 style="margin-top:0">قدّم شكوى أو اقتراح</h3>
      <form id="complaintForm">
        <div class="form-grid">
          <div class="field"><label>الاسم</label><input type="text" id="compName" required></div>
          <div class="field"><label>رقم الموبايل</label><input type="tel" id="compPhone" required placeholder="01xxxxxxxxx"></div>
          <div class="field full">
            <label>النوع</label>
            <select id="compType">
              <option>شكوى بخصوص طلب</option>
              <option>مشكلة في منتج</option>
              <option>تأخير في الشحن</option>
              <option>اقتراح لتحسين الموقع</option>
              <option>أخرى</option>
            </select>
          </div>
          <div class="field full"><label>رقم الطلب (لو موجود)</label><input type="text" id="compOrder" placeholder="مثال: KS-AB12C"></div>
          <div class="field full"><label>التفاصيل</label><textarea id="compMessage" required placeholder="اكتب مشكلتك أو اقتراحك بالتفصيل..."></textarea></div>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top:18px;width:100%">إرسال</button>
      </form>
    </div>

    <div class="card">
      <h3 style="margin-top:0">تابع حالة شكواك</h3>
      <p class="form-note" style="margin-bottom:16px">اكتب رقم مرجع الشكوى اللي هتوصلك بعد الإرسال</p>
      <div class="field" style="margin-bottom:14px">
        <input type="text" id="checkComplaintId" placeholder="مثال: k2x9f3ab1">
      </div>
      <button class="btn btn-dark" onclick="checkComplaintStatus()">عرض حالة الشكوى</button>
      <div id="myComplaints" style="margin-top:20px"></div>
      <div id="myComplaintsDevice" style="margin-top:24px"></div>
    </div>
  </div>

  <div class="wrap">
    <div class="success-box" id="complaintSuccess" style="display:none;max-width:640px;margin:24px auto 0;text-align:center"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/layout.js"></script>
<script type="module" src="js/firebase-init.js"></script>
<script>
  bootstrapPage("complaints");

  document.getElementById("complaintForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const submitBtn = e.target.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    submitBtn.textContent = "جاري الإرسال...";

    const complaint = {
      id: KS.uid(),
      date: new Date().toISOString(),
      name: document.getElementById("compName").value,
      phone: document.getElementById("compPhone").value,
      type: document.getElementById("compType").value,
      orderId: document.getElementById("compOrder").value,
      message: document.getElementById("compMessage").value,
      status: "جديدة"
    };

    try {
      await KS.createComplaintCloud(complaint);
      document.getElementById("complaintsLayout").style.display = "none";
      const box = document.getElementById("complaintSuccess");
      box.style.display = "block";
      box.innerHTML = `
        تم استلام شكواك بنجاح 🙏 هنتواصل معاك في أقرب وقت ممكن.<br>
        رقم مرجع الشكوى: <strong>${complaint.id}</strong> — احتفظ بيه لو حبيت تتابع حالتها.<br><br>
        <a href="index.html" class="btn btn-dark">الرجوع للمتجر</a>
      `;
    } catch (err) {
      console.error(err);
      submitBtn.disabled = false;
      submitBtn.textContent = "إرسال";
      showToast("حصل خطأ في إرسال الشكوى، حاول تاني");
    }
  });

  function statusClass(status) {
    if (status === "ملغي") return "status-ملغي";
    return "status-" + status.replace(/\s+/g, "-");
  }

  async function checkComplaintStatus() {
    const id = document.getElementById("checkComplaintId").value.trim();
    const box = document.getElementById("myComplaints");
    if (!id) { box.innerHTML = `<div class="warn-note">اكتب رقم مرجع الشكوى الأول</div>`; return; }
    box.innerHTML = `<div class="form-note">جاري البحث...</div>`;
    const c = await KS.getComplaintById(id);
    if (!c) {
      box.innerHTML = `<div class="empty-state">مفيش شكوى بالرقم ده</div>`;
      return;
    }
    box.innerHTML = `
      <div class="complaint-row">
        <div>
          <strong>${c.type}</strong>
          <p style="margin:6px 0;color:var(--ink-soft);font-size:14px">${c.message}</p>
          <span style="font-size:12.5px;color:#9b9584">${new Date(c.date).toLocaleDateString("ar-EG")}</span>
        </div>
        <span class="status-pill ${statusClass(c.status)}">${c.status}</span>
      </div>
    `;
  }

  // شكاوى إتبعتت من الجهاز ده — عرض سريع من غير ما تكتب الرقم
  async function renderMyComplaintsDevice() {
    const ids = KS.getLocalIds(KS.KEYS.myComplaints);
    const box = document.getElementById("myComplaintsDevice");
    if (ids.length === 0) return;
    box.innerHTML = `<h4 style="margin-bottom:10px">شكاواك من الجهاز ده</h4><div class="form-note">جاري التحميل...</div>`;
    const list = (await Promise.all(ids.map(id => KS.getComplaintById(id)))).filter(Boolean);
    if (list.length === 0) { box.innerHTML = ""; return; }
    box.innerHTML = `<h4 style="margin-bottom:10px">شكاواك من الجهاز ده</h4>` + list.map(c => `
      <div class="complaint-row" style="cursor:pointer" onclick="document.getElementById('checkComplaintId').value='${c.id}';checkComplaintStatus()">
        <div><strong>${c.type}</strong> <span class="form-note">(${new Date(c.date).toLocaleDateString("ar-EG")})</span></div>
        <span class="status-pill ${statusClass(c.status)}">${c.status}</span>
      </div>
    `).join("");
  }
  renderMyComplaintsDevice();
</script>
</body>
</html>
