<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تتبّع طلبك | Koresh Store</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/favicon.png">
</head>
<body>

<div id="site-header"></div>

<section class="page-hero">
  <div class="wrap">
    <h1>تتبّع طلبك</h1>
    <p>اكتب رقم الطلب اللي وصلك بعد إتمام الشراء عشان تعرف حالة الشحن</p>
  </div>
</section>

<section class="page-content">
  <div class="wrap" style="max-width:640px">
    <div class="card">
      <div class="form-grid">
        <div class="field full">
          <label>رقم الطلب</label>
          <input type="text" id="trackInput" placeholder="مثال: KS-AB12C">
        </div>
      </div>
      <button class="btn btn-primary" style="margin-top:16px" onclick="trackOrder()">تتبّع الطلب</button>
    </div>

    <div id="trackResult" style="margin-top:24px"></div>

    <div id="myOrdersBox" style="margin-top:28px"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/layout.js"></script>
<script type="module" src="js/firebase-init.js"></script>
<script>
  bootstrapPage("track");

  const statusSteps = ["قيد التجهيز", "جاهز للشحن", "تم الشحن", "في الطريق", "تم التوصيل"];

  async function trackOrder() {
    const q = document.getElementById("trackInput").value.trim().toUpperCase();
    const result = document.getElementById("trackResult");
    if (!q) { result.innerHTML = `<div class="warn-note">من فضلك اكتب رقم الطلب</div>`; return; }

    result.innerHTML = `<div class="form-note">جاري البحث...</div>`;
    const order = await KS.getOrderById(q);

    if (!order) {
      result.innerHTML = `<div class="warn-note">
        مش لاقيين طلب بالرقم ده. تأكد إنك كتبته صح، أو تواصل معانا مباشرة عبر واتساب.
        <br><br><a href="https://wa.me/${KS.getSettings().whatsapp}" target="_blank" class="btn btn-dark" style="margin-top:8px">تواصل عبر واتساب</a>
      </div>`;
      return;
    }

    renderOrderCard(result, order);
  }

  function renderOrderCard(container, order) {
    if (order.status === "ملغي") {
      container.innerHTML = `
        <div class="card">
          <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px">
            <h3 style="margin:0">طلب ${order.id}</h3>
            <span class="status-pill status-ملغي">ملغي</span>
          </div>
          <p style="color:var(--ink-soft);margin:6px 0 0">تم إلغاء الطلب ده. لو محتاج تفاصيل أكتر، تواصل معانا عبر واتساب.</p>
        </div>
      `;
      return;
    }

    const stepIndex = statusSteps.indexOf(order.status);
    container.innerHTML = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px">
          <h3 style="margin:0">طلب ${order.id}</h3>
          <span class="status-pill status-قيد-المعالجة">${order.status}</span>
        </div>
        <p style="color:var(--ink-soft);margin:6px 0 20px">تاريخ الطلب: ${new Date(order.date).toLocaleDateString("ar-EG")}</p>
        <div style="display:flex;gap:8px;margin-bottom:24px">
          ${statusSteps.map((s, i) => `
            <div style="flex:1;text-align:center">
              <div style="height:6px;border-radius:4px;background:${i <= stepIndex ? "var(--brass)" : "var(--line)"};margin-bottom:8px"></div>
              <div style="font-size:11.5px;color:${i <= stepIndex ? "var(--ink)" : "var(--ink-soft)"}">${s}</div>
            </div>
          `).join("")}
        </div>
        <h4>محتويات الطلب</h4>
        ${order.items.map(i => `
          <div class="cart-item">
            <img src="${i.image}" alt="${i.name}">
            <div class="info">
              <h5>${i.name} × ${i.qty}</h5>
              <div class="meta">${[i.size, i.color].filter(Boolean).join(" · ") || i.category}</div>
            </div>
          </div>
        `).join("")}
        <div class="cart-total-row" style="margin-top:14px"><span>الإجمالي</span><span>${KS.fmt(order.total)}</span></div>
      </div>
    `;
  }

  // طلبات إتعملت من الجهاز/المتصفح ده — تسهيل سريع من غير ما تكتب الرقم
  async function renderMyOrders() {
    const ids = KS.getLocalIds(KS.KEYS.myOrders);
    const box = document.getElementById("myOrdersBox");
    if (ids.length === 0) return;
    box.innerHTML = `<h4 style="margin-bottom:10px">طلباتك من الجهاز ده</h4><div id="myOrdersList" class="form-note">جاري التحميل...</div>`;
    const list = document.getElementById("myOrdersList");
    const orders = (await Promise.all(ids.map(id => KS.getOrderById(id)))).filter(Boolean);
    if (orders.length === 0) { box.innerHTML = ""; return; }
    list.outerHTML = orders.map(o => `
      <div class="complaint-row" style="cursor:pointer" onclick="document.getElementById('trackInput').value='${o.id}';trackOrder();window.scrollTo({top:0,behavior:'smooth'})">
        <div><strong>${o.id}</strong> — ${new Date(o.date).toLocaleDateString("ar-EG")}</div>
        <span class="status-pill ${o.status === "ملغي" ? "status-ملغي" : "status-قيد-المعالجة"}">${o.status}</span>
      </div>
    `).join("");
  }
  renderMyOrders();
</script>
</body>
</html>
